# First current-frame DWCG scenarios: one pedestrian, coordinates in configured
# simulator frame (planner-3 launches explicitly use world). Trigger on goal.
dwcg_approach:
  - {start: [3.0, 1.2, 0.0], vel: [-0.4, 0.0, 0.0], size: [0.5, 0.5, 1.7], period: 8.0, mode: trigger}
dwcg_crossing:
  - {start: [2.0, -2.0, 0.0], vel: [0.0, 0.4, 0.0], size: [0.5, 0.5, 1.7], period: 10.0, mode: trigger}
dwcg_stationary:
  - {start: [2.0, 0.0, 0.0], vel: [0.0, 0.0, 0.0], size: [0.5, 0.5, 1.7], period: 15.0, mode: trigger}

mixed:
  # 横向穿越
  - {start: [1.0, 2.5, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: trigger}
  # 迎面行人
  - {start: [-2.5, -3.0, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 6.0, mode: loop}
  # 背后超越/同向
  - {start: [0.0, -4.5, 0.0], vel: [0.3, 0.0, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: loop}

mixed_stress:
  # Same pedestrian motions as mixed; paired with a stronger fixed start/goal.
  - {start: [1.0, 2.5, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: trigger}
  - {start: [-2.5, -3.0, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 6.0, mode: loop}
  - {start: [0.0, -4.5, 0.0], vel: [0.3, 0.0, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: loop}

mixed_stress_reverse:
  # Same pedestrian motions as mixed_stress; reverse start/goal regression.
  - {start: [1.0, 2.5, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: trigger}
  - {start: [-2.5, -3.0, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 6.0, mode: loop}
  - {start: [0.0, -4.5, 0.0], vel: [0.3, 0.0, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: loop}

mixed_turn_upper:
  # Same pedestrian motions as mixed_stress; lower-to-upper cornering regression.
  - {start: [1.0, 2.5, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: trigger}
  - {start: [-2.5, -3.0, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 6.0, mode: loop}
  - {start: [0.0, -4.5, 0.0], vel: [0.3, 0.0, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: loop}

crossing:
  - {start: [1.0, 2.5, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: trigger}

crossing_early:
  - {start: [1.0, 3.2, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: trigger}

crossing_simultaneous:
  - {start: [1.0, 2.5, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: trigger}

crossing_late:
  - {start: [1.0, 1.8, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: trigger}

headon:
  - {start: [-2.5, -3.0, 0.0], vel: [0.0, 0.5, 0.0], size: [0.5, 0.5, 1.7], period: 6.0, mode: loop}

overtake:
  - {start: [0.0, -4.5, 0.0], vel: [0.3, 0.0, 0.0], size: [0.5, 0.5, 1.7], period: 4.0, mode: loop}
